apiVersion: v1
kind: Service
metadata:
  name: {{ include "webhook.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "webhook.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "webhook.selector" . | nindent 4 }}
  ports:
    - name: https
      port: 443
      targetPort: https
